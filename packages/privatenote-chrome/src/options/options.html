<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PrivateNote Settings</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <main class="page">
    <h1 id="optionsTitle"></h1>
    <p class="subtitle" id="optionsSubtitle"></p>

    <form id="settingsForm">
      <div class="field">
        <label for="defaultExpiresIn" id="defaultExpiryLabel"></label>
        <select id="defaultExpiresIn">
          <option value="15m">15 minutes</option>
          <option value="1h">1 hour</option>
          <option value="24h">1 day</option>
          <option value="7d">7 days</option>
        </select>
      </div>

      <div class="setting-item checkbox-row">
        <input type="checkbox" id="defaultBurnAfterReading" />
        <label for="defaultBurnAfterReading" id="defaultBurnLabel"></label>
      </div>

      <div class="field">
        <label for="theme" id="themeLabel"></label>
        <select id="theme">
          <option value="system">System</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </div>

      <div class="field">
        <label for="language" id="languageLabel"></label>
        <select id="language">
          <option value="en">English</option>
        </select>
      </div>

      <button type="submit" class="submit-btn" id="saveButton"></button>
    </form>

    <div id="toast" class="toast"></div>
  </main>

  <script type="module" src="options.js"></script>
</body>
</html>
