  <!-- Content Security Policy -->
  <!-- Note: CSP is also set via HTTP headers in Worker for API responses -->
  <!-- frame-ancestors only works in HTTP headers, not meta tags -->
  <!-- upgrade-insecure-requests removed for local development (causes SSL errors with Vite) -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://challenges.cloudflare.com https://static.cloudflareinsights.com https://cdn.jsdelivr.net 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self' http://localhost:* http://127.0.0.1:* https://privatenote-api.marjan-skrobot.workers.dev https://privatenote-ai.pages.dev https://*.privatenote-ai.pages.dev https://*.pages.dev https://privatenote.ai https://*.privatenote.ai https://api.pwnedpasswords.com https://challenges.cloudflare.com https://cloudflareinsights.com https://huggingface.co https://*.huggingface.co https://cdn-lfs.huggingface.co https://cdn-lfs-us-1.huggingface.co https://cdn-lfs-eu-1.huggingface.co https://cdn-lfs-us-1.hf.co https://cdn-lfs-eu-1.hf.co https://*.hf.co https://*.r2.dev https://raw.githubusercontent.com https://cdn.jsdelivr.net; img-src 'self' data: https:; frame-src https://challenges.cloudflare.com; worker-src 'self' blob:; base-uri 'none'; form-action 'self'; object-src 'none';" />
  
  <title>PrivateNote.ai - Secure Encrypted Notes</title>
  
  <!-- Cloudflare Turnstile (only loaded on creation page, not note viewing) -->
  <!-- Note: Turnstile uses dynamic versioned URLs, so SRI is not practical -->
  <!-- The script is only loaded on pages that use AI features, not on note viewing pages -->
  <script 
    src="https://challenges.cloudflare.com/turnstile/v0/api.js" 
    async 
    defer
    crossorigin="anonymous">
  </script>
</head>

  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
