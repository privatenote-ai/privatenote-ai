  <!-- Critical CSS: body/hero colors before Tailwind. The entry stylesheet stays
       render-blocking in production so prerendered HTML does not flash unstyled.
       Production preloads only Satoshi-latin-700 and Inter-latin-400 woff2. -->
  <style id="pn-critical">
    body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background-color:hsl(210 50% 98%);color:hsl(222.2 84% 4.9%)}
    @media (prefers-color-scheme:dark){html:not(.light) body{background-color:hsl(222.2 84% 4.9%);color:hsl(210 40% 98%)}}
    html.dark body{background-color:hsl(222.2 84% 4.9%);color:hsl(210 40% 98%)}
    html.light body{background-color:hsl(210 50% 98%);color:hsl(222.2 84% 4.9%)}
    .page-title{font-family:Satoshi,Inter,system-ui,sans-serif;font-size:2.375rem;font-weight:700;letter-spacing:0;line-height:1.08;text-align:center;color:hsl(222.2 84% 4.9%)}
    @media (min-width:640px){.page-title{font-size:2.625rem}}
    @media (min-width:768px){.page-title{font-size:3.5rem}}
    @media (min-width:768px) and (max-height:900px){.page-title{font-size:3.25rem;line-height:1.08}}
    @media (prefers-color-scheme:dark){html:not(.light) .page-title{color:hsl(210 40% 98%)}}
    html.dark .page-title{color:hsl(210 40% 98%)}
    html.light .page-title{color:hsl(222.2 84% 4.9%)}
    .pn-hero-narrow{display:block}
    .pn-hero-wide{display:none}
    @media (min-width:768px){.pn-hero-narrow{display:none}.pn-hero-wide{display:block}}
    html.pn-app #pn-home-prerender{display:none!important}
    @media (min-width:768px){#pn-home-prerender{display:none!important}}
    @media (min-width:640px){.pn-home{padding-top:2rem}}
    @media (min-width:768px) and (max-height:900px){.pn-home{padding-top:1rem}}
  </style>
  <style id="pn-home-hero-critical">
    #pn-home-prerender[hidden]{display:none!important}
    .pn-home-prerender{position:absolute;left:0;right:0;top:0;z-index:1;padding-top:2rem;padding-bottom:0;pointer-events:none}
    .pn-hero-wrap{position:relative;max-width:56rem;margin:0 auto;padding:0 1rem}
    .pn-hero-title{text-align:center}
    .pn-hero-l1,.pn-hero-l2{display:block}
    .pn-hero-l2{margin-top:.25rem;color:hsl(240 100% 50%)}
    .pn-hero-sub{margin:.75rem auto 0;max-width:56rem;text-align:center;font-size:1.125rem;line-height:1.75rem;color:hsl(220 9% 46%)}
    @media (min-width:768px){.pn-hero-sub{margin-top:1.25rem;font-size:1.375rem;line-height:2rem;max-width:64rem}}
    @media (min-width:768px) and (max-height:900px){.pn-hero-sub{margin-top:.75rem;font-size:1.125rem;line-height:1.75rem}}
    @media (prefers-color-scheme:dark){html:not(.light) .pn-hero-l1{color:hsl(210 40% 98%)}html:not(.light) .pn-hero-sub{color:hsl(220 9% 65%)}}
    html.dark .pn-hero-l1{color:hsl(210 40% 98%)}
    html.dark .pn-hero-sub{color:hsl(220 9% 65%)}
  </style>
  <link rel="stylesheet" href="/src/index.css" />

  <!-- Prefill guard: defer so it does not block HTML parsing; still runs before the
       type=module bundle (document order). Moves #text= to sessionStorage and sets
       html.light / html.dark from stored theme. Sync was slightly earlier for hash
       stripping but cost ~render-blocking in Lighthouse. -->
  <script defer src="/prefill-guard.js"></script>
</head>
<body>
  <!-- LCP hero lives outside #root so createRoot() cannot retimestamp LCP. -->
  <div id="pn-home-prerender" class="pn-home-prerender">
    <section class="pn-hero-wrap" aria-label="PrivateNote">
      <div class="pn-hero-title">
        <h1 class="page-title">
          <span class="pn-hero-l1" id="pn-hero-l1">Your Messages,</span>
          <span class="pn-hero-l2" id="pn-hero-l2">Your Privacy</span>
        </h1>
        <p class="pn-hero-sub" id="pn-hero-sub">Share passwords, sensitive messages, and files via end-to-end encrypted links that disappear after opening. No recipient accounts. No ads. Zero profiling.</p>
      </div>
    </section>
  </div>
  <div id="root"></div>

  <script type="module" src="/src/main.tsx"></script>
</body>
