<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">PrivateNote.ai secure encrypted notes</title>
  <desc id="desc">A PrivateNote.ai preview card for encrypted read-once notes.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="58" x2="0" y2="142" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFDF8"/>
      <stop offset="1" stop-color="#EDE6D8"/>
    </linearGradient>
    <linearGradient id="panel" x1="696" y1="142" x2="1076" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF4FF"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#F8FBFF"/>
  <rect x="756" y="-110" width="520" height="520" rx="140" fill="#E0E7FF" opacity=".78"/>
  <rect x="-128" y="-84" width="430" height="430" rx="118" fill="#DBEAFE" opacity=".68"/>
  <g transform="translate(72 72)">
