  <text x="206" y="122" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="850" fill="#0000FF">privateNote</text>
  <text x="452" y="99" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="850" fill="#0000FF">.ai</text>
  <text x="72" y="292" font-family="Inter, Arial, sans-serif" font-size="66" font-weight="850" fill="#0F172A">Send sensitive info</text>
  <text x="72" y="366" font-family="Inter, Arial, sans-serif" font-size="66" font-weight="850" fill="#0000FF">without permanent records.</text>
  <text x="76" y="450" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="500" fill="#475569">Read-once encrypted notes for passwords, recovery codes,</text>
  <text x="76" y="488" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="500" fill="#475569">and private handoffs.</text>
