    </g>
  </g>

  <text x="152" y="92" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="850" fill="#0000FF" letter-spacing="-0.02em">privateNote</text>
  <text x="324" y="74" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="850" fill="#0000FF">.ai</text>

  <text x="640" y="288" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="850" fill="#0F172A" letter-spacing="-0.02em">Share secrets.</text>
  <text x="640" y="356" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="850" fill="#0000FF" letter-spacing="-0.02em">Leave no trail.</text>

  <text x="1216" y="592" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="500" fill="#475569">Encrypted in browser &#183; Read once &#183; No plaintext on server</text>
</svg>
