    </linearGradient>
  </defs>
  <rect width="440" height="280" fill="#F8FBFF"/>
  <circle cx="392" cy="28" r="92" fill="#E0E7FF" opacity=".68"/>
  <circle cx="36" cy="268" r="72" fill="#DBEAFE" opacity=".58"/>

