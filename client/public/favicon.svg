<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="privateNote favicon">
  <!-- Same mark as in-app Logo, scaled down (~84%) for clarity at 16–32px tab icons -->
  <g transform="translate(32 32) scale(0.84) translate(-32 -32)">
    <defs>
      <linearGradient id="fn-paper" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#FFFDF8" />
        <stop offset="100%" stop-color="#EDE6D8" />
      </linearGradient>
    </defs>
    <rect x="4" y="4" width="56" height="56" rx="14" fill="#0000FF" />
    <g transform="translate(0 -4.5)">
      <path
        d="M14 23 L32 39 L50 23 V50 H14Z"
        fill="url(#fn-paper)"
        stroke="white"
        stroke-opacity="0.45"
        stroke-width="0.85"
      />
      <path
        d="M14 23 L32 39 L50 23Z"
        fill="url(#fn-paper)"
        fill-opacity="0.97"
      />
      <path
        d="M14 23 L32 39 L50 23"
        fill="none"
        stroke="#0000FF"
        stroke-width="1.1"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </g>
  </g>
</svg>
