<svg width="1500" height="500" viewBox="0 0 1500 500" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">PrivateNote.ai X banner</title>
  <desc id="desc">PrivateNote.ai branded X header for encrypted notes that disappear after reading.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF8"/>
      <stop offset="1" stop-color="#EDE6D8"/>
    </linearGradient>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FBFF"/>
      <stop offset="0.64" stop-color="#F3F8FF"/>
      <stop offset="1" stop-color="#FFFDF8"/>
    </linearGradient>
    <pattern id="dots" width="42" height="42" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="2" fill="#D7E2F0"/>
    </pattern>
  </defs>
  <rect width="1500" height="500" fill="url(#background)"/>
  <rect width="1500" height="500" fill="url(#dots)" opacity="0.5"/>
  <path d="M1408 0H1500V500H1320C1368 366 1394 202 1408 0Z" fill="#0000FF"/>
  <path d="M0 292C122 264 252 266 390 300V500H0V292Z" fill="#FFFFFF" opacity="0.72"/>
  <text x="470" y="194" font-family="Inter, Arial, sans-serif" font-size="70" font-weight="850" fill="#0000FF">PrivateNote AI</text>
  <text x="472" y="270" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="760" fill="#0F172A">Self-destructing messages for private sharing.</text>
  <text x="474" y="330" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="560" fill="#475569">Encrypted in your browser. Read once. No plaintext on the server.</text>
</svg>
