name: PR check

# Validates build + full prerender before merge to main or develop (no deploy).
on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-prerender:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL: skip

      - name: Unit tests
        run: npm run test:unit

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build and prerender (full)
        run: npm run build:prerender
