name: Release CLI

on:
  workflow_dispatch:
    inputs:
      version:
        description: "CLI package version (from packages/privatenote-cli/package.json if empty)"
        required: false
        type: string
  push:
    tags:
      - "cli-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare release artifacts
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ] && [[ "${GITHUB_REF_NAME}" == cli-v* ]]; then
            VERSION="${GITHUB_REF_NAME#cli-v}"
          fi
          bash packages/privatenote-cli/scripts/prepare-release.sh "${VERSION:-}"

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/cli-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/privatenote-cli/release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
