name: Deploy Pages (Staging branches)

# Pre-main QA: push to `premium` or `develop` → branch URL on Cloudflare Pages.
# URLs: https://premium.privatenote-ai.pages.dev , https://develop.privatenote-ai.pages.dev
# Trusted like production for API/auth (see shared/pagesAppHosts.ts, src/trustedOrigins.ts).

on:
  push:
    branches:
      - premium
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore prerender HTML cache
        uses: actions/cache/restore@v4
        id: prerender-html-cache
        with:
          path: .prerender-html-cache
          key: prerender-html-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            prerender-html-${{ github.ref_name }}-

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL: skip

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build and prerender
        run: npm run build:prerender
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          VITE_API_URL: https://privatenote-api-staging.marjan-skrobot.workers.dev
          PRERENDER_INCREMENTAL: "1"
          PRERENDER_HTML_CACHE_DIR: .prerender-html-cache
          PRERENDER_BASE_SHA: ${{ github.event.before }}
          PRERENDER_HEAD_SHA: ${{ github.sha }}

      - name: Save prerender HTML cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: .prerender-html-cache
          key: prerender-html-${{ github.ref_name }}-${{ github.sha }}

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy prerender --project-name "${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}" --branch "${{ github.ref_name }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
