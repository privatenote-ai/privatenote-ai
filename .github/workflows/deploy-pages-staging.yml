name: Deploy Pages (Staging branches)

# Pre-main QA: push to `premium` or `develop` → branch URL on Cloudflare Pages.
# URLs: https://premium.privatenote-ai.pages.dev , https://develop.privatenote-ai.pages.dev
# Same-site Safari upload QA: https://premium.privatenote.ai → upload-staging.privatenote.ai
# Trusted like production for API/auth (see shared/pagesAppHosts.ts, src/trustedOrigins.ts).
#
# Staging skips prerender (SPA shell only) so QA deploys stay fast. Production
# SEO prerender remains on Deploy Pages (Prerender) for `main`.

on:
  push:
    branches:
      - premium
      - develop

# Rapid pushes otherwise race two deploys onto the same Pages branch and
# briefly 404 hashed chunks (composer missing / white screen on premium).
concurrency:
  group: pages-staging-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL: skip

      - name: Build (no prerender)
        run: npm run build:staging
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name "${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}" --branch "${{ github.ref_name }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
