name: Deploy Pages (Prerender)

on:
  push:
    branches:
      - main
  # Periodic safety net: re-render every route from scratch once a week so any
  # drift in cached/reused HTML (missed by the incremental classifier) is healed.
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC
  workflow_dispatch:
    inputs:
      force_full:
        description: "Force a full prerender of every route (ignore incremental cache)"
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore prerender HTML cache
        uses: actions/cache/restore@v4
        id: prerender-html-cache
        with:
          path: .prerender-html-cache
          key: prerender-html-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            prerender-html-${{ github.ref_name }}-

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL: skip

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build and prerender
        run: npm run build:prerender
        env:
          PRERENDER_INCREMENTAL: "1"
          PRERENDER_HTML_CACHE_DIR: .prerender-html-cache
          PRERENDER_BASE_SHA: ${{ github.event.before }}
          PRERENDER_HEAD_SHA: ${{ github.sha }}
          # Scheduled runs and manual force_full dispatches ignore the cache and
          # re-render every route. getChangedFiles() returns null on "1".
          PRERENDER_FORCE_FULL: ${{ (github.event_name == 'schedule' || inputs.force_full) && '1' || '' }}

      - name: Save prerender HTML cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: .prerender-html-cache
          # run_id keeps the key unique so a scheduled full render persists its
          # fresh cache; restore-keys prefix-matches the most recent one.
          key: prerender-html-${{ github.ref_name }}-${{ github.sha }}-${{ github.run_id }}

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy prerender --project-name "${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}" --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
