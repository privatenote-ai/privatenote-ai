name = "privatenote-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# KV namespace binding
[[kv_namespaces]]
binding = "NOTES_KV"
id = "f19b8957a39b422486311962ca759563"

[[kv_namespaces]]
binding = "ANALYTICS_KV"
id = "af52edc654a844ae999cc4fc35ba5a38"

# Encrypted note attachments.
[[r2_buckets]]
binding = "NOTE_FILES_R2"
bucket_name = "privatenote-files-eu"

# Durable Objects binding
[[durable_objects.bindings]]
name = "SECURE_NOTES"
class_name = "SecureNoteStorageSql"

# Auth scaffolding
[[kv_namespaces]]
binding = "AUTH_KV"
id = "dcbc57c897c442deb18d99a1193267d4"
#
[[d1_databases]]
binding = "AUTH_DB"
database_name = "privatenote-auth-eu"
database_id = "3f04a908-4f7a-4782-9d00-cb9c9303ae70"
# Applies baseline auth tables (sessions, users, …) to local D1 on `wrangler dev` and on deploy.
# Keep 0001 in sync with src/auth/schema.sql. Manual upgrades stay in src/auth/migrations/.
migrations_dir = "src/auth/d1-migrations"

[ai]
binding = "AI"
# Route AI calls to the real Cloudflare Workers AI service during local dev so that
# models not simulated by Miniflare (e.g. @cf/google/gemma-4-26b-a4b-it) work correctly.
experimental_remote = true
#
# [[durable_objects.bindings]]
# name = "AUTH_TOKENS"
# class_name = "AuthTokenStore"

[[durable_objects.bindings]]
name = "AUTH_TOKENS"
class_name = "AuthTokenStore"

[[migrations]]
tag = "v4-auth-tokens"
new_classes = ["AuthTokenStore"]

[[migrations]]
tag = "v5-secure-notes-sqlite"
new_sqlite_classes = ["SecureNoteStorageSql"]

# SecureNoteStorageSql uses the Durable Object SQL API (`state.storage.sql`). Local `wrangler dev`
# (Miniflare) only enables SQL if the class was first registered with `new_sqlite_classes` — otherwise
# note create returns: "SQL is not enabled for this Durable Object class". After local DO changes,
# delete `.wrangler/state` once so local migrations re-apply cleanly.
#
# v5 `new_sqlite_classes = ["SecureNoteStorageSql"]` was removed from this file: production already
# applied it; keeping it causes deploy error 10074 ("already depended on by existing Durable Objects").
# Greenfield: if you create a brand-new Worker name, add a fresh migration with new_sqlite_classes
# before first production deploy. See https://developers.cloudflare.com/durable-objects/reference/durable-objects-migrations/

# Environment variables (set via wrangler secret put or dashboard)

[vars]
AUTH_EMAIL_PROVIDER = "resend"
AUTH_EMAIL_FROM = "PrivateNote <no-reply@privatenote.ai>"
# Optional: primary HTTPS origin for magic / email-change links when Origin is missing (must match trustedOrigins allowlist). Example: "https://privatenote.ai"
# PUBLIC_WEB_APP_ORIGIN = "https://privatenote.ai"
# Production: set AUTH_SECRET_KEY via `wrangler secret put AUTH_SECRET_KEY`.
# It protects magic-link KV integrity and recipient email gate HMACs. Local wrangler dev on localhost may omit it only when those features are unused.
# Billing launch: set `STRIPE_SECRET_KEY` and `STRIPE_WEBHOOK_SECRET` via `wrangler secret put`.
# The Premium page also needs `VITE_STRIPE_PREMIUM_MONTHLY_PAYMENT_LINK` and/or `VITE_STRIPE_PREMIUM_YEARLY_PAYMENT_LINK` at frontend build time.
# Uncomment while debugging WebAuthn / auth: API returns { debug, route, phase } on failures; see `wrangler tail`.
# AUTH_DEBUG = "1"

[build]
command = "npm run build"

# Cron triggers for scheduled maintenance tasks
# Runs hourly so expired/destroyed attachment storage is released promptly.
[triggers]
crons = ["0 * * * *"]

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

# Migration configuration
# Keep all applied tags in this file. v4 adds AuthTokenStore; v5 registers SecureNoteStorageSql with SQLite (required for local dev).
