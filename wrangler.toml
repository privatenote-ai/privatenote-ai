name = "privatenote-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# KV namespace binding
[[kv_namespaces]]
binding = "NOTES_KV"
id = "f19b8957a39b422486311962ca759563"

[[kv_namespaces]]
binding = "ANALYTICS_KV"
id = "af52edc654a844ae999cc4fc35ba5a38"

# Durable Objects binding
[[durable_objects.bindings]]
name = "SECURE_NOTES"
class_name = "SecureNoteStorageSql"

# Environment variables (set via wrangler secret put or dashboard)
# OPENAI_API_KEY will be set via: wrangler secret put OPENAI_API_KEY

[build]
command = "npm run build"

# Pages configuration (for Pages deployments)
pages_build_output_dir = "dist"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

# Migration configuration
# v1 migration was already applied in production with SQLite support
# We keep it here to match the deployed state
[[migrations]]
tag = "v1"
new_classes = ["SecureNoteStorage"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["SecureNoteStorageSql"]

[[migrations]]
tag = "v3"
delete_classes = ["SecureNoteStorage"]
