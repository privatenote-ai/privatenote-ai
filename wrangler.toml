name = "privatenote-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# KV namespace binding
[[kv_namespaces]]
binding = "NOTES_KV"
id = "f19b8957a39b422486311962ca759563"

[[kv_namespaces]]
binding = "ANALYTICS_KV"
id = "af52edc654a844ae999cc4fc35ba5a38"

# Durable Objects binding
[[durable_objects.bindings]]
name = "SECURE_NOTES"
class_name = "SecureNoteStorageSql"

# Auth scaffolding
[[kv_namespaces]]
binding = "AUTH_KV"
id = "dcbc57c897c442deb18d99a1193267d4"
#
[[d1_databases]]
binding = "AUTH_DB"
database_name = "privatenote-auth"
database_id = "b9ae1541-7226-40b6-9ff7-8ce49781b025"
#
# [[durable_objects.bindings]]
# name = "AUTH_TOKENS"
# class_name = "AuthTokenStore"

[[durable_objects.bindings]]
name = "AUTH_TOKENS"
class_name = "AuthTokenStore"

[[migrations]]
tag = "v4-auth-tokens"
new_classes = ["AuthTokenStore"]

# Required for SecureNoteStorageSql (DO SQL). Local `wrangler dev` reads this;
# without it, note creation fails with "SQL is not enabled for this Durable Object class".
# Do not remove: Cloudflare tracks applied migration tags; removing past tags breaks deploy.
[[migrations]]
tag = "v5-secure-notes-sqlite"
new_sqlite_classes = ["SecureNoteStorageSql"]

# Environment variables (set via wrangler secret put or dashboard)

[vars]
AUTH_EMAIL_PROVIDER = "resend"
AUTH_EMAIL_FROM = "PrivateNote <no-reply@privatenote.ai>"
# Optional: primary HTTPS origin for magic / email-change links when Origin is missing (must match trustedOrigins allowlist). Example: "https://privatenote.ai"
# PUBLIC_WEB_APP_ORIGIN = "https://privatenote.ai"
# Production: set AUTH_SECRET_KEY via `wrangler secret put AUTH_SECRET_KEY`. Local wrangler dev on localhost may omit it; other hosts need secrets or AUTH_ALLOW_UNSIGNED_MAGIC_LINK=1 (never in prod).
# Uncomment while debugging WebAuthn / auth: API returns { debug, route, phase } on failures; see `wrangler tail`.
# AUTH_DEBUG = "1"

[build]
command = "npm run build"

# Cron triggers for scheduled maintenance tasks
# Runs daily at 3:00 AM UTC for audit log cleanup (GDPR compliance)
[triggers]
crons = ["0 3 * * *"]

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

# Migration configuration
# Keep all applied tags (v4, v5, …) in this file. v1–v3 ran on this worker historically;
# v4 adds AuthTokenStore; v5 registers SecureNoteStorageSql with SQLite for wrangler dev + prod.
