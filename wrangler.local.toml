# Local development only — use with `wrangler dev --config wrangler.local.toml`.
# Production deploy must use wrangler.toml (v5 sqlite migration omitted there to avoid error 10074).
name = "privatenote-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[kv_namespaces]]
binding = "NOTES_KV"
id = "f19b8957a39b422486311962ca759563"

[[kv_namespaces]]
binding = "ANALYTICS_KV"
id = "af52edc654a844ae999cc4fc35ba5a38"

[[r2_buckets]]
binding = "NOTE_FILES_R2"
bucket_name = "privatenote-files-eu"

[[durable_objects.bindings]]
name = "SECURE_NOTES"
class_name = "SecureNoteStorageSql"

[[kv_namespaces]]
binding = "AUTH_KV"
id = "dcbc57c897c442deb18d99a1193267d4"

[[d1_databases]]
binding = "AUTH_DB"
database_name = "privatenote-auth-eu"
database_id = "3f04a908-4f7a-4782-9d00-cb9c9303ae70"
migrations_dir = "src/auth/d1-migrations"

# Workers AI is omitted locally. Wrangler treats [ai] as a remote binding and
# otherwise fails to start when it cannot create a Cloudflare preview session.

[[durable_objects.bindings]]
name = "AUTH_TOKENS"
class_name = "AuthTokenStore"

[[migrations]]
tag = "v4-auth-tokens"
new_classes = ["AuthTokenStore"]

# Required for local `wrangler dev` / Docker self-host — enables DO SQLite for note storage.
[[migrations]]
tag = "v5-secure-notes-sqlite"
new_sqlite_classes = ["SecureNoteStorageSql"]

[vars]
LOCAL_DEV = "1"
AUTH_EMAIL_PROVIDER = "resend"
AUTH_EMAIL_FROM = "PrivateNote <no-reply@privatenote.ai>"
BILLING_OWNER_EMAIL = "marjanskrobot@gmail.com"
# Optional local R2 presign (same account as scripts/upload-*.sh). Secrets via .dev.vars.
R2_ACCOUNT_ID = "4cf4e785755949c2f0a61d2f3b532b69"
R2_BUCKET_NAME = "privatenote-files-eu"

# Skip vite build on worker startup — API-only local dev.
# [build]
# command = "npm run build"

[triggers]
crons = ["0 * * * *"]

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
